[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dotmatrix"
version = "0.1.0"
description = "Control iDotMatrix LED displays via Bluetooth"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "idotmatrix>=0.0.9",
    "bleak>=0.21",
    "click>=8.0",
    "pillow>=10.0",
    "rich>=13.0",
]

[project.scripts]
dotmatrix = "dotmatrix.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
